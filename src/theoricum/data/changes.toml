summary = """Desde el 11 de mayo de 2021 el límite en vías urbanas es de 30 km/h si hay un único carril por sentido, 20 km/h con plataforma única de calzada y acera, y 50 km/h con dos o más carriles por sentido (RD 970/2020)."""
manual = [10]
since = "2021-06"
level = "warning"
topics = ["velocidad"]
keywords = ["urban*", "poblad*", "travesia*", "ciudad*", "calle*"]
note = """Desde el 11 de mayo de 2021 el límite en vías urbanas es de 30 km/h con un único carril \
por sentido, 20 km/h con plataforma única y 50 km/h con dos o más carriles por sentido \
(RD 970/2020). Esta pregunta es anterior."""

