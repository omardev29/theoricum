# Cambios normativos que pueden dejar anticuadas las preguntas anteriores a su entrada en vigor.
#
# Cada [[change]] se aplica a las preguntas que cumplen todo esto:
# - tienen fecha anterior a `since` (AAAA-MM o AAAA-MM-DD) o no tienen fecha;
# - si hay `topics`, son de uno de esos temas;
# - en el enunciado o en la respuesta correcta aparece alguna de las `keywords` (las opciones
#   incorrectas no cuentan: lo que era falso con la norma antigua sigue siéndolo);
# - si hay `also`, aparece además alguna de esas palabras.
# Las palabras se comparan como en topics.toml: sin tildes ni mayúsculas, y «*» al final es un prefijo.
#
# level:
# - "warning": la pregunta se marca con «⚠ posible anticuada», no sale en el examen y la nota se
#   muestra al corregir;
# - "info": solo se muestra la nota al corregir.
#
# `title` y `summary` forman la hoja de novedades (Manual en el menú y `dgt manual`): lo que ha
# cambiado desde el manual de la DGT (diciembre de 2023) y desde preguntas más antiguas. `manual`
# son los temas de ese manual a los que afecta.
#
# Añade solo cambios con base legal comprobada y cita la norma en la nota y en el resumen.

[[change]]
id = "v16"
title = "Baliza V-16 en lugar de los triángulos"
summary = """Desde el 1 de enero de 2026 la baliza luminosa V-16 conectada es obligatoria para señalizar un vehículo inmovilizado y sustituye a los triángulos de preseñalización de peligro (RD 159/2021)."""
manual = [5, 16]
since = "2026-01"
level = "warning"
# «triángulo» a secas no: también es la marca de ceda el paso o la forma de una señal.
keywords = [
    "triangulos", "triangulo de presenalizacion", "triangulo senalizador", "un triangulo por",
    "presenalizacion de peligro",
]
note = """Desde el 1 de enero de 2026 la baliza V-16 conectada es obligatoria y sustituye a los \
triángulos de preseñalización de peligro (RD 159/2021). Esta pregunta es anterior."""

